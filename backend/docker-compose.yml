version: '0.1'

services:

  authx:
    build: .
    container_name: authx
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - mail
    networks:
      - authx-net


  redis:
    image: redis:7
    container_name: authx_redis
    ports:
      - "6379:6379"
    networks:
      - authx-net

  postgres:
    image: postgres:15
    container_name: authx_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: authx_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - authx-net
  mail:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - authx-net

volumes:
  pgdata:

networks:
  authx-net:
